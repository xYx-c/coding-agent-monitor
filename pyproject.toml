[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-monitor"
version = "0.2.0"
description = "Standalone local coding-agent supervisor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coding-agent-monitor = "coding_agent_monitor.cli:main"

[tool.setuptools]
packages = ["coding_agent_monitor"]

[tool.uv]
package = true
